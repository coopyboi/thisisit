<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      width: 320px; 
      padding: 16px; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8eaed;
    }
    h1 { 
      font-size: 16px; 
      margin-bottom: 12px; 
      display: flex; 
      align-items: center; 
      gap: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid #333;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34a853;
      box-shadow: 0 0 8px #34a853;
    }
    .status-text { font-size: 13px; color: #9aa0a6; }
    .count {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }
    .label { font-size: 11px; text-transform: uppercase; color: #9aa0a6; letter-spacing: 0.5px; }
    .info {
      font-size: 12px;
      color: #9aa0a6;
      line-height: 1.5;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }
    .toggle {
      position: relative;
      width: 40px;
      height: 20px;
      background: #5f6368;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.active { background: #34a853; }
    .toggle::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    .toggle.active::after { transform: translateX(20px); }
  </style>
</head>
<body>
  <h1>🛡️ AI Overview Blocker</h1>
  
  <div class="status">
    <div class="status-dot"></div>
    <div>
      <div class="status-text">Protection Active</div>
      <div class="count" id="blockedCount">0</div>
      <div class="label">Overviews Blocked</div>
    </div>
  </div>
  
  <div class="toggle-row">
    <span style="font-size: 13px;">Aggressive Mode</span>
    <div class="toggle active" id="aggressiveToggle"></div>
  </div>
  
  <div class="info">
    This extension blocks AI Overviews at the network level before they reach your device, and scrubs any that slip through from the DOM.
  </div>

  <script src="popup.js"></script>
</body>
</html>
